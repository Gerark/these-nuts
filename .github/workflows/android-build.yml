name: Android Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle wrapper jar
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sSL https://services.gradle.org/distributions/gradle-8.4-bin.zip -o /tmp/gradle-8.4-bin.zip
            unzip -q /tmp/gradle-8.4-bin.zip -d /tmp/gradle
            cp /tmp/gradle/gradle-8.4/lib/gradle-wrapper-8.4.jar gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug
